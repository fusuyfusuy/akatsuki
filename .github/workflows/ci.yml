name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Clippy (vectors feature)
        run: cargo clippy --features vectors --all-targets -- -D warnings

      # mimodept: e5-small weights (~470 MB) unprovisioned in GitHub Actions <- CI runner cache budget -> when full vector-embedding integration tests must run in CI
      - name: Unit tests (vectors feature)
        run: cargo test --features vectors --lib
